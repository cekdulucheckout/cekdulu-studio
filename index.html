<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Template Affiliate Studio • cekdulu.checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- html2canvas untuk render gambar resolusi penuh -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-dark: #141c17;
      --panel-dark: #1d2620;
      --input-dark: #141b16;
      --border-dark: #2f3d34;
      --text-light: #f3f4f1;
      --text-muted: #9ba69e;
      --accent-green: #26382b;
      --card-cream: #f7f4ec;
      --card-box: #ebe5d5;
      --card-text: #1c2920;
      --card-sub: #5c665f;
      --btn-primary: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-light);
    }
    .header p {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* Platform Size Selector */
    .size-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .size-btn {
      background: var(--panel-dark);
      border: 1.5px solid var(--border-dark);
      color: var(--text-muted);
      padding: 10px 8px;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .size-btn strong {
      display: block;
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 2px;
    }
    .size-btn span {
      font-size: 10.5px;
    }
    .size-btn.active {
      border-color: #68b07b;
      background: #223227;
    }
    .size-btn.active strong {
      color: #8ee0a3;
    }

    /* Preview Wrapper (Responsive Scaling) */
    .preview-stage {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 4px 0;
    }

    /* Actual Poster Card Base (Rendered at exact pixel scale when exporting) */
    #posterCard {
      background-color: var(--card-cream);
      color: var(--card-text);
      border-radius: 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      transform-origin: top center;
      flex-shrink: 0;
    }

    /* Layout Variants */
    /* 1. IG & FB: 1080 x 1350 */
    #posterCard.size-ig {
      width: 1080px;
      height: 1350px;
      padding: 64px 68px;
    }
    #posterCard.size-ig .image-box {
      height: 640px;
      margin: 32px 0 38px 0;
    }

    /* 2. TikTok: 1080 x 1920 */
    #posterCard.size-tiktok {
      width: 1080px;
      height: 1920px;
      padding: 110px 72px 130px 72px;
    }
    #posterCard.size-tiktok .image-box {
      height: 880px;
      margin: 44px 0 52px 0;
    }
    #posterCard.size-tiktok .card-title {
      font-size: 72px;
      margin-bottom: 24px;
    }
    #posterCard.size-tiktok .card-desc {
      font-size: 34px;
      margin-bottom: 32px;
    }
    #posterCard.size-tiktok .card-bullets {
      font-size: 30px;
    }

    /* 3. X & Threads: 1600 x 900 (Landscape Split Layout) */
    #posterCard.size-x {
      width: 1600px;
      height: 900px;
      padding: 56px 68px;
      flex-direction: row;
      gap: 56px;
      align-items: stretch;
    }
    #posterCard.size-x .x-left {
      width: 680px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    #posterCard.size-x .x-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    #posterCard.size-x .image-box {
      flex: 1;
      height: 100%;
      margin: 0;
    }
    #posterCard.size-x .card-title {
      font-size: 62px;
    }

    /* Card Internal Elements */
    .card-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: var(--card-sub);
      text-transform: uppercase;
    }

    .image-box {
      width: 100%;
      background-color: var(--card-box);
      border-radius: 32px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.1s ease, filter 0.1s ease;
    }
    .image-placeholder {
      color: #8f8a7c;
      font-size: 28px;
      font-weight: 500;
    }

    .card-body {
      display: flex;
      flex-direction: column;
    }

    .card-category {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--card-sub);
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .card-category .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #79947e;
      display: inline-block;
    }

    .card-title {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.12;
      color: var(--card-text);
      margin-bottom: 18px;
      letter-spacing: -1px;
    }

    .card-desc {
      font-size: 30px;
      line-height: 1.42;
      color: var(--card-sub);
      margin-bottom: 24px;
      font-weight: 400;
    }

    .card-bullets {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 26px;
      font-size: 27px;
      font-weight: 600;
      color: #36453b;
    }
    .card-bullets span {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .card-bullets span::before {
      content: "•";
      color: #79947e;
      font-size: 32px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: auto;
      padding-top: 28px;
    }

    .price-block .price-label {
      font-size: 24px;
      color: var(--card-sub);
      margin-bottom: 4px;
      font-weight: 500;
    }
    .price-block .price-value {
      font-size: 54px;
      font-weight: 800;
      color: var(--card-text);
      letter-spacing: -0.5px;
    }

    .cta-pill {
      background-color: var(--accent-green);
      color: #ffffff;
      font-size: 30px;
      font-weight: 700;
      padding: 26px 46px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    /* Action Download Bar */
    .action-bar {
      display: flex;
      gap: 10px;
    }
    .btn-download {
      flex: 1;
      background: #4e9a63;
      color: #fff;
      border: none;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-download:hover {
      background: #3f8252;
    }
    .btn-download:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    /* Control Panel */
    .controls-panel {
      background: var(--panel-dark);
      border: 1px solid var(--border-dark);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      background: var(--input-dark);
      border: 1px solid var(--border-dark);
      color: var(--text-light);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13.5px;
      outline: none;
    }
    input[type="text"]:focus,
    input[type="password"]:focus,
    textarea:focus {
      border-color: #68b07b;
    }

    .file-upload-box {
      background: var(--input-dark);
      border: 1px dashed var(--border-dark);
      padding: 10px 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    input[type="file"] {
      font-size: 12.5px;
      color: var(--text-muted);
      width: 100%;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    /* AI Box */
    .ai-box {
      background: #17241c;
      border: 1px solid #2e4a38;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ai-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ai-header span {
      font-size: 12.5px;
      font-weight: 700;
      color: #8ee0a3;
    }
    .btn-ai {
      background: linear-gradient(135deg, #2e7d47, #1f5c33);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-ai:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .ai-status {
      font-size: 11.5px;
      color: #a3c4ad;
      display: none;
    }
    .checkbox-inline {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-muted);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="header">
      <h1 id="headerTitle">Template Affiliate • 1080×1350</h1>
      <p>Pilih ukuran platform, unggah foto produk (AI Gemini otomatis mengisi teks jika API aktif), sesuaikan posisi, lalu klik Unduh PNG.</p>
    </div>

    <!-- Platform Size Switcher -->
    <div class="size-tabs">
      <button class="size-btn active" data-size="ig" data-w="1080" data-h="1350" data-label="1080×1350">
        <strong>IG & Facebook</strong>
        <span>1080 × 1350</span>
      </button>
      <button class="size-btn" data-size="tiktok" data-w="1080" data-h="1920" data-label="1080×1920">
        <strong>TikTok / Story</strong>
        <span>1080 × 1920</span>
      </button>
      <button class="size-btn" data-size="x" data-w="1600" data-h="900" data-label="1600×900">
        <strong>X & Threads</strong>
        <span>1600 × 900</span>
      </button>
    </div>

    <!-- Live Scaled Poster Preview -->
    <div class="preview-stage" id="previewStage">
      <div id="posterCard" class="size-ig">
        <!-- Container layout will be structured dynamically for IG/TikTok vs X -->
      </div>
    </div>

    <!-- Download Button -->
    <div class="action-bar">
      <button class="btn-download" id="downloadBtn">
        💾 Unduh Gambar PNG (<span id="btnSizeText">1080×1350</span>)
      </button>
    </div>

    <!-- Editor Controls -->
    <div class="controls-panel">
      <!-- Upload Foto -->
      <div class="control-group">
        <label>Foto produk</label>
        <div class="file-upload-box">
          <input type="file" id="imageInput" accept="image/*" />
        </div>
      </div>

      <!-- Gemini API Auto-Fill Section -->
      <div class="ai-box">
        <div class="ai-header">
          <span>✨ Auto-Generate Teks (Gemini AI)</span>
          <label class="checkbox-inline">
            <input type="checkbox" id="autoGenOnUpload" checked /> Otomatis saat unggah
          </label>
        </div>
        <input type="password" id="geminiApiKey" placeholder="Tempel Gemini API Key kamu di sini (tersimpan di browser)" />
        <button class="btn-ai" id="generateAiBtn" type="button">
          ✨ Generate Judul, Deskripsi & Keunggulan dari Foto
        </button>
        <div class="ai-status" id="aiStatus"></div>
      </div>

      <!-- Zoom & Kecerahan -->
      <div class="control-row">
        <div class="control-group">
          <label>Zoom foto</label>
          <input type="range" id="zoomRange" min="1" max="2.5" step="0.05" value="1" />
        </div>
        <div class="control-group">
          <label>Kecerahan</label>
          <input type="range" id="brightnessRange" min="0.6" max="1.5" step="0.05" value="1.05" />
        </div>
      </div>

      <!-- Nomor & Kategori -->
      <div class="control-row">
        <div class="control-group">
          <label>Nomor</label>
          <input type="text" id="inputNumber" value="No. 001" />
        </div>
        <div class="control-group">
          <label>Kategori</label>
          <input type="text" id="inputCategory" value="Perlengkapan Rumah" />
        </div>
      </div>

      <!-- Nama Produk -->
      <div class="control-group">
        <label>Nama produk</label>
        <input type="text" id="inputTitle" value="Ember Lipat Portable" />
      </div>

      <!-- Deskripsi Singkat -->
      <div class="control-group">
        <label>Deskripsi singkat</label>
        <textarea id="inputDesc" rows="2">Praktis, hemat tempat, serbaguna. Tersedia ukuran 3L, 5L, 10L.</textarea>
      </div>

      <!-- Keunggulan -->
      <div class="control-group">
        <label>Keunggulan (pisahkan dengan |)</label>
        <input type="text" id="inputBullets" value="Bisa dilipat | Hemat tempat | Kuat & tahan lama" />
      </div>

      <!-- Harga & Ajakan Beli -->
      <div class="control-row">
        <div class="control-group">
          <label>Harga (tulis "Mulai Rp..." jika bervarian)</label>
          <input type="text" id="inputPrice" value="Mulai Rp15.000" />
        </div>
        <div class="control-group">
          <label>Ajakan beli</label>
          <input type="text" id="inputCta" value="Cek di Shopee →" />
        </div>
      </div>

      <!-- Nama Akun -->
      <div class="control-group">
        <label>Nama akun</label>
        <input type="text" id="inputBrand" value="CEKDULU.CHECKOUT" />
      </div>
    </div>
  </div>

  <script>
    // State
    let currentSize = "ig";
    let currentWidth = 1080;
    let currentHeight = 1350;
    let uploadedImageDataUrl = null;
    let uploadedImageMime = "image/jpeg";

    // DOM Elements
    const posterCard = document.getElementById("posterCard");
    const previewStage = document.getElementById("previewStage");
    const headerTitle = document.getElementById("headerTitle");
    const btnSizeText = document.getElementById("btnSizeText");
    const downloadBtn = document.getElementById("downloadBtn");

    const imageInput = document.getElementById("imageInput");
    const zoomRange = document.getElementById("zoomRange");
    const brightnessRange = document.getElementById("brightnessRange");

    const inputNumber = document.getElementById("inputNumber");
    const inputCategory = document.getElementById("inputCategory");
    const inputTitle = document.getElementById("inputTitle");
    const inputDesc = document.getElementById("inputDesc");
    const inputBullets = document.getElementById("inputBullets");
    const inputPrice = document.getElementById("inputPrice");
    const inputCta = document.getElementById("inputCta");
    const inputBrand = document.getElementById("inputBrand");

    const geminiApiKeyInput = document.getElementById("geminiApiKey");
    const generateAiBtn = document.getElementById("generateAiBtn");
    const autoGenOnUpload = document.getElementById("autoGenOnUpload");
    const aiStatus = document.getElementById("aiStatus");

    // Load saved API key from localStorage
    const savedKey = localStorage.getItem("cekdulu_gemini_api_key");
    if (savedKey) geminiApiKeyInput.value = savedKey;

    geminiApiKeyInput.addEventListener("input", () => {
      localStorage.setItem("cekdulu_gemini_api_key", geminiApiKeyInput.value.trim());
    });

    // Render Poster HTML structure & update values
    function renderPoster() {
      const brand = inputBrand.value || "CEKDULU.CHECKOUT";
      const num = inputNumber.value || "No. 001";
      const category = inputCategory.value || "Perlengkapan Rumah";
      const title = inputTitle.value || "Nama Produk";
      const desc = inputDesc.value || "";
      const bulletsRaw = inputBullets.value || "";
      const priceText = inputPrice.value.trim();
      const cta = inputCta.value || "Cek di Shopee →";

      // Split "Mulai " label if user starts price with "Mulai "
      let priceLabel = "";
      let priceMain = priceText;
      if (priceText.toLowerCase().startsWith("mulai ")) {
        priceLabel = "Mulai";
        priceMain = priceText.substring(6).trim();
      }

      const bulletsHtml = bulletsRaw
        .split("|")
        .map(b => b.trim())
        .filter(Boolean)
        .map(b => `<span>${escapeHtml(b)}</span>`)
        .join("");

      const zoom = zoomRange.value;
      const brightness = brightnessRange.value;
      const imageHtml = uploadedImageDataUrl
        ? `<img src="${uploadedImageDataUrl}" style="transform: scale(${zoom}); filter: brightness(${brightness});" alt="Produk" />`
        : `<div class="image-placeholder">Unggah foto produk</div>`;

      posterCard.className = `size-${currentSize}`;

      if (currentSize === "x") {
        // Landscape split layout for X & Threads (1600x900)
        posterCard.innerHTML = `
          <div class="x-left">
            <div class="image-box">${imageHtml}</div>
          </div>
          <div class="x-right">
            <div class="card-top-bar">
              <span>${escapeHtml(brand)}</span>
              <span>${escapeHtml(num)}</span>
            </div>
            <div class="card-body">
              <div class="card-category"><i class="dot"></i>${escapeHtml(category)}</div>
              <div class="card-title">${escapeHtml(title)}</div>
              <div class="card-desc">${escapeHtml(desc)}</div>
              <div class="card-bullets">${bulletsHtml}</div>
            </div>
            <div class="card-footer">
              <div class="price-block">
                ${priceLabel ? `<div class="price-label">${escapeHtml(priceLabel)}</div>` : ""}
                <div class="price-value">${escapeHtml(priceMain)}</div>
              </div>
              <div class="cta-pill">${escapeHtml(cta)}</div>
            </div>
          </div>
        `;
      } else {
        // Vertical layout for IG/FB (1080x1350) and TikTok (1080x1920)
        posterCard.innerHTML = `
          <div class="card-top-bar">
            <span>${escapeHtml(brand)}</span>
            <span>${escapeHtml(num)}</span>
          </div>
          <div class="image-box">${imageHtml}</div>
          <div class="card-body">
            <div class="card-category"><i class="dot"></i>${escapeHtml(category)}</div>
            <div class="card-title">${escapeHtml(title)}</div>
            <div class="card-desc">${escapeHtml(desc)}</div>
            <div class="card-bullets">${bulletsHtml}</div>
          </div>
          <div class="card-footer">
            <div class="price-block">
              ${priceLabel ? `<div class="price-label">${escapeHtml(priceLabel)}</div>` : ""}
              <div class="price-value">${escapeHtml(priceMain)}</div>
            </div>
            <div class="cta-pill">${escapeHtml(cta)}</div>
          </div>
        `;
      }

      scalePreview();
    }

    // Scale poster to fit mobile/desktop viewport cleanly
    function scalePreview() {
      const containerWidth = previewStage.clientWidth;
      const scale = Math.min(containerWidth / currentWidth, 1);
      posterCard.style.transform = `scale(${scale})`;
      previewStage.style.height = `${currentHeight * scale}px`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Size Switcher Events
    document.querySelectorAll(".size-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".size-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentSize = btn.dataset.size;
        currentWidth = parseInt(btn.dataset.w, 10);
        currentHeight = parseInt(btn.dataset.h, 10);
        headerTitle.textContent = `Template Affiliate • ${btn.dataset.label}`;
        btnSizeText.textContent = btn.dataset.label;
        renderPoster();
      });
    });

    // Live Form Input Listeners
    [
      zoomRange, brightnessRange, inputNumber, inputCategory,
      inputTitle, inputDesc, inputBullets, inputPrice, inputCta, inputBrand
    ].forEach(el => el.addEventListener("input", renderPoster));

    window.addEventListener("resize", scalePreview);

    // Handle Image Upload
    imageInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      uploadedImageMime = file.type || "image/jpeg";

      const reader = new FileReader();
      reader.onload = async (ev) => {
        uploadedImageDataUrl = ev.target.result;
        renderPoster();

        // Auto-generate via Gemini if API key is present and checkbox is checked
        if (autoGenOnUpload.checked && geminiApiKeyInput.value.trim()) {
          await generateWithGemini();
        }
      };
      reader.readAsDataURL(file);
    });

    // Gemini API Vision Auto-Generator
    async function generateWithGemini() {
      const apiKey = geminiApiKeyInput.value.trim();
      if (!apiKey) {
        showStatus("⚠️ Masukkan Gemini API Key terlebih dahulu.", "#fbbf24");
        return;
      }
      if (!uploadedImageDataUrl) {
        showStatus("⚠️ Unggah foto produk terlebih dahulu.", "#fbbf24");
        return;
      }

      generateAiBtn.disabled = true;
      showStatus("⏳ Gemini sedang menganalisis foto produk...", "#8ee0a3");

      try {
        const base64Data = uploadedImageDataUrl.split(",")[1];
        const promptText = `Kamu adalah copywriter katalog affiliate Indonesia bernama cekdulu.checkout dengan gaya bahasa jujur, singkat, padat, dan meyakinkan ("Murah itu wajib, bagus itu harus").
Analisis foto produk ini dan buat teks untuk kartu katalog sosial media dalam format JSON murni tanpa markdown:
{
  "kategori": "Pilih 1 yang paling pas dari: Alat Dapur | Wadah & Rak | Alat Kebersihan | Kamar Mandi | Perlengkapan Rumah | Dekorasi Rumah | Gadget & Elektronik | Pakaian & Outfit",
  "nama_produk": "Nama produk singkat, jelas, maksimal 4-5 kata (contoh: Ember Lipat Portable)",
  "deskripsi": "1 kalimat singkat deskripsi manfaat & variasi produk, maksimal 85 karakter",
  "keunggulan": "3 poin keunggulan singkat dipisahkan tanda | (contoh: Bisa dilipat | Hemat tempat | Kuat & tahan lama)"
}`;

        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  {
                    inline_data: {
                      mime_type: uploadedImageMime,
                      data: base64Data
                    }
                  }
                ]
              }],
              generationConfig: {
                response_mime_type: "application/json",
                temperature: 0.4
              }
            })
          }
        );

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error?.message || `HTTP ${response.status}`);
        }

        const result = await response.json();
        const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
        const parsed = JSON.parse(rawText);

        if (parsed.kategori) inputCategory.value = parsed.kategori;
        if (parsed.nama_produk) inputTitle.value = parsed.nama_produk;
        if (parsed.deskripsi) inputDesc.value = parsed.deskripsi;
        if (parsed.keunggulan) inputBullets.value = parsed.keunggulan;

        renderPoster();
        showStatus("✅ Teks otomatis berhasil diisi dari foto!", "#8ee0a3");
      } catch (err) {
        console.error(err);
        showStatus(`❌ Gagal generate: ${err.message}`, "#f87171");
      } finally {
        generateAiBtn.disabled = false;
      }
    }

    generateAiBtn.addEventListener("click", generateWithGemini);

    function showStatus(msg, color) {
      aiStatus.style.display = "block";
      aiStatus.style.color = color;
      aiStatus.textContent = msg;
    }

    // Download High-Resolution PNG (1080x1350, 1080x1920, or 1600x900)
    downloadBtn.addEventListener("click", async () => {
      downloadBtn.disabled = true;
      const originalHtml = downloadBtn.innerHTML;
      downloadBtn.innerHTML = "⏳ Menyimpan gambar resolusi penuh...";

      try {
        // Temporarily reset CSS scale to 1 so html2canvas captures exact native pixels
        const prevTransform = posterCard.style.transform;
        posterCard.style.transform = "scale(1)";

        const canvas = await html2canvas(posterCard, {
          width: currentWidth,
          height: currentHeight,
          scale: 1,
          useCORS: true,
          backgroundColor: null
        });

        posterCard.style.transform = prevTransform;

        const cleanTitle = (inputTitle.value || "produk")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/(^-|-$)/g, "");
        const fileName = `${inputNumber.value.replace(/[^a-zA-Z0-9]/g, "") || "001"}-${cleanTitle}-${currentWidth}x${currentHeight}.png`;

        const link = document.createElement("a");
        link.download = fileName;
        link.href = canvas.toDataURL("image/png");
        link.click();
      } catch (err) {
        alert("Gagal menyimpan gambar: " + err.message);
      } finally {
        downloadBtn.disabled = false;
        downloadBtn.innerHTML = originalHtml;
      }
    });

    // Initial render
    renderPoster();
  </script>
</body>
</html>
