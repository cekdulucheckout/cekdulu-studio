<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Template Affiliate Studio • cekdulu.checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-dark: #141c17;
      --panel-dark: #1d2620;
      --input-dark: #141b16;
      --border-dark: #2f3d34;
      --text-light: #f3f4f1;
      --text-muted: #9ba69e;
      --accent-green: #26382b;
      --card-cream: #f7f4ec;
      --card-box: #ebe5d5;
      --card-text: #1c2920;
      --card-sub: #5c665f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-light);
    }
    .header p {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* Platform Size Selector */
    .size-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .size-btn {
      background: var(--panel-dark);
      border: 1.5px solid var(--border-dark);
      color: var(--text-muted);
      padding: 10px 8px;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .size-btn strong {
      display: block;
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 2px;
    }
    .size-btn span {
      font-size: 10.5px;
    }
    .size-btn.active {
      border-color: #68b07b;
      background: #223227;
    }
    .size-btn.active strong {
      color: #8ee0a3;
    }

    /* Preview Wrapper */
    .preview-stage {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
      padding: 4px 0;
    }

    /* Actual Poster Card Base (Clean edge, no shadow artifact on export) */
    #posterCard {
      background-color: var(--card-cream);
      color: var(--card-text);
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transform-origin: top center;
      flex-shrink: 0;
    }

    /* Clean export mode (removes rounded corner/shadow artifacts when saving) */
    #posterCard.exporting {
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    /* 1. IG & FB: 1080 x 1350 */
    #posterCard.size-ig {
      width: 1080px;
      height: 1350px;
      padding: 60px 68px;
    }
    #posterCard.size-ig .image-box {
      height: 600px;
      margin: 28px 0 32px 0;
    }

    /* 2. TikTok: 1080 x 1920 */
    #posterCard.size-tiktok {
      width: 1080px;
      height: 1920px;
      padding: 105px 72px 125px 72px;
    }
    #posterCard.size-tiktok .image-box {
      height: 840px;
      margin: 40px 0 46px 0;
    }
    #posterCard.size-tiktok .card-title {
      font-size: 70px;
      margin-bottom: 22px;
    }
    #posterCard.size-tiktok .card-desc {
      font-size: 33px;
      margin-bottom: 26px;
    }
    #posterCard.size-tiktok .card-bullets {
      font-size: 29px;
    }

    /* 3. X & Threads: 1600 x 900 */
    #posterCard.size-x {
      width: 1600px;
      height: 900px;
      padding: 52px 64px;
      flex-direction: row;
      gap: 52px;
      align-items: stretch;
    }
    #posterCard.size-x .x-left {
      width: 670px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    #posterCard.size-x .x-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    #posterCard.size-x .image-box {
      flex: 1;
      height: 100%;
      margin: 0;
    }
    #posterCard.size-x .card-title {
      font-size: 58px;
    }
    #posterCard.size-x .card-desc {
      font-size: 28px;
      margin-bottom: 18px;
    }
    #posterCard.size-x .card-bullets {
      font-size: 25px;
    }

    /* Card Internal Elements */
    .card-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: var(--card-sub);
      text-transform: uppercase;
    }

    /* Multi-Photo Collage Container */
    .image-box {
      width: 100%;
      background-color: var(--card-box);
      border-radius: 32px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .image-placeholder {
      color: #8f8a7c;
      font-size: 28px;
      font-weight: 500;
      text-align: center;
      padding: 20px;
    }

    .photo-grid {
      width: 100%;
      height: 100%;
      display: grid;
      gap: 12px;
      background-color: var(--card-cream);
    }
    .photo-grid.count-1 {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      gap: 0;
    }
    .photo-grid.count-2 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
    }
    .photo-grid.count-3 {
      grid-template-columns: 1.35fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .photo-grid.count-3 .photo-slot:first-child {
      grid-row: 1 / 3;
    }
    .photo-grid.count-4 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    .photo-slot {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      background-color: var(--card-box);
      border-radius: 22px;
    }
    .photo-grid.count-1 .photo-slot {
      border-radius: 32px;
    }
    .photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .more-overlay {
      position: absolute;
      inset: 0;
      background: rgba(20, 28, 23, 0.58);
      color: #fff;
      font-size: 46px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-body {
      display: flex;
      flex-direction: column;
    }

    .card-category {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--card-sub);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .card-category .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #79947e;
      display: inline-block;
    }

    .card-title {
      font-size: 62px;
      font-weight: 800;
      line-height: 1.12;
      color: var(--card-text);
      margin-bottom: 16px;
      letter-spacing: -1px;
    }

    .card-desc {
      font-size: 29px;
      line-height: 1.4;
      color: var(--card-sub);
      margin-bottom: 20px;
      font-weight: 400;
    }

    .card-bullets {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      font-size: 26px;
      font-weight: 600;
      color: #36453b;
      margin-bottom: 18px;
    }
    .card-bullets span {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .card-bullets span::before {
      content: "•";
      color: #79947e;
      font-size: 30px;
    }

    /* Hashtags inside card */
    .card-tags {
      font-size: 22px;
      font-weight: 600;
      color: #5b7862;
      letter-spacing: 0.2px;
      line-height: 1.35;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: auto;
      padding-top: 22px;
    }

    .price-block .price-label {
      font-size: 24px;
      color: var(--card-sub);
      margin-bottom: 4px;
      font-weight: 500;
    }
    .price-block .price-value {
      font-size: 54px;
      font-weight: 800;
      color: var(--card-text);
      letter-spacing: -0.5px;
    }

    .cta-pill {
      background-color: var(--accent-green);
      color: #ffffff;
      font-size: 30px;
      font-weight: 700;
      padding: 24px 44px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    /* Action Download Bar */
    .action-bar {
      display: flex;
      gap: 8px;
    }
    .btn-download {
      flex: 2;
      background: #4e9a63;
      color: #fff;
      border: none;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-download:hover {
      background: #3f8252;
    }
    .btn-download:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .btn-copy-caption {
      flex: 1;
      background: #233328;
      color: #a9e3b8;
      border: 1px solid #3c5c46;
      padding: 14px 12px;
      border-radius: 14px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    /* Control Panel */
    .controls-panel {
      background: var(--panel-dark);
      border: 1px solid var(--border-dark);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      background: var(--input-dark);
      border: 1px solid var(--border-dark);
      color: var(--text-light);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13.5px;
      outline: none;
    }
    input[type="text"]:focus,
    input[type="password"]:focus,
    textarea:focus {
      border-color: #68b07b;
    }

    .file-upload-box {
      background: var(--input-dark);
      border: 1px dashed var(--border-dark);
      padding: 10px 12px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .file-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-file-pick {
      background: #2b3a30;
      color: #e4ede6;
      border: 1px solid #3f5446;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-file-clear {
      background: transparent;
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, 0.35);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    .photo-count-badge {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: auto;
    }

    /* Thumbnail Strip */
    .thumb-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .thumb-strip:empty {
      display: none;
    }
    .thumb-item {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      border: 1px solid var(--border-dark);
    }
    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: none;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    /* AI Copywriter Box */
    .ai-box {
      background: #17241c;
      border: 1px solid #2e4a38;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ai-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .ai-header span {
      font-size: 12.5px;
      font-weight: 700;
      color: #8ee0a3;
    }
    .ss-upload-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 22, 18, 0.7);
      border: 1px dashed #395c45;
      padding: 8px 10px;
      border-radius: 9px;
    }
    .btn-ss-pick {
      background: #243b2c;
      color: #b7ebd0;
      border: 1px solid #3c634a;
      padding: 7px 11px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .ss-info-text {
      font-size: 11.5px;
      color: #96b09f;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .ai-btn-row {
      display: flex;
      gap: 8px;
    }
    .btn-ai {
      flex: 1;
      background: linear-gradient(135deg, #2e7d47, #1f5c33);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-ai:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-lock {
      background: #243329;
      color: #a3c4ad;
      border: 1px solid #385241;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-lock.locked {
      background: #473818;
      color: #fcd34d;
      border-color: #926c1d;
    }
    .ai-status {
      font-size: 11.5px;
      color: #a3c4ad;
      display: none;
      line-height: 1.4;
    }
    .checkbox-inline {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-muted);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="header">
      <h1 id="headerTitle">Template Affiliate • 1080×1350</h1>
      <p>Unggah foto produk & screenshot Shopee sekali, kunci teksnya agar 100% konsisten, lalu unduh untuk semua ukuran platform.</p>
    </div>

    <!-- Platform Size Switcher -->
    <div class="size-tabs">
      <button class="size-btn active" data-size="ig" data-w="1080" data-h="1350" data-label="1080×1350">
        <strong>IG & Facebook</strong>
        <span>1080 × 1350</span>
      </button>
      <button class="size-btn" data-size="tiktok" data-w="1080" data-h="1920" data-label="1080×1920">
        <strong>TikTok / Story</strong>
        <span>1080 × 1920</span>
      </button>
      <button class="size-btn" data-size="x" data-w="1600" data-h="900" data-label="1600×900">
        <strong>X & Threads</strong>
        <span>1600 × 900</span>
      </button>
    </div>

    <!-- Live Scaled Poster Preview -->
    <div class="preview-stage" id="previewStage">
      <div id="posterCard" class="size-ig"></div>
    </div>

    <!-- Download & Copy Caption Buttons -->
    <div class="action-bar">
      <button class="btn-download" id="downloadBtn">
        💾 Unduh PNG (<span id="btnSizeText">1080×1350</span>)
      </button>
      <button class="btn-copy-caption" id="copyCaptionBtn" type="button">
        📋 Salin Caption
      </button>
    </div>

    <!-- Editor Controls -->
    <div class="controls-panel">
      <!-- Upload Multi-Foto Produk -->
      <div class="control-group">
        <label>1. Foto produk untuk poster (bisa pilih lebih dari 1 foto)</label>
        <div class="file-upload-box">
          <input type="file" id="imageInput" accept="image/*" multiple style="display: none;" />
          <div class="file-actions">
            <button type="button" class="btn-file-pick" id="pickFilesBtn">📷 Pilih / Tambah Foto</button>
            <button type="button" class="btn-file-clear" id="clearFilesBtn">Hapus Semua</button>
            <span class="photo-count-badge" id="photoCountBadge">0 foto dipilih</span>
          </div>
          <div class="thumb-strip" id="thumbStrip"></div>
        </div>
      </div>

      <!-- AI Copywriter & Screenshot Reader Box -->
      <div class="ai-box">
        <div class="ai-header">
          <span>✨ Copywriter Otomatis (Konsisten)</span>
          <label class="checkbox-inline">
            <input type="checkbox" id="autoGenOnUpload" checked /> Auto-jalan sekali
          </label>
        </div>

        <input type="password" id="geminiApiKey" placeholder="Tempel Gemini API Key kamu di sini (tersimpan di browser)" />

        <!-- Upload Screenshot Shopee -->
        <div class="ss-upload-row">
          <input type="file" id="screenshotInput" accept="image/*" multiple style="display: none;" />
          <button type="button" class="btn-ss-pick" id="pickSsBtn">📄 Upload Screenshot Shopee</button>
          <span class="ss-info-text" id="ssInfoText">Wajib disarankan agar judul 100% akurat</span>
          <button type="button" class="btn-file-clear" id="clearSsBtn" style="padding: 5px 8px;">×</button>
        </div>

        <div class="ai-btn-row">
          <button class="btn-ai" id="generateAiBtn" type="button">
            ✍️ Generate Teks
          </button>
          <button class="btn-lock" id="lockTextBtn" type="button" title="Kunci teks agar tidak berubah saat ganti ukuran">
            🔓 Kunci Teks
          </button>
        </div>
        <div class="ai-status" id="aiStatus"></div>
      </div>

      <!-- Zoom & Kecerahan -->
      <div class="control-row">
        <div class="control-group">
          <label>Zoom foto</label>
          <input type="range" id="zoomRange" min="1" max="2.5" step="0.05" value="1" />
        </div>
        <div class="control-group">
          <label>Kecerahan</label>
          <input type="range" id="brightnessRange" min="0.6" max="1.5" step="0.05" value="1.05" />
        </div>
      </div>

      <!-- Nomor & Kategori -->
      <div class="control-row">
        <div class="control-group">
          <label>Nomor</label>
          <input type="text" id="inputNumber" value="No. 001" />
        </div>
        <div class="control-group">
          <label>Kategori</label>
          <input type="text" id="inputCategory" value="Perlengkapan Rumah" />
        </div>
      </div>

      <!-- Nama Produk -->
      <div class="control-group">
        <label>Nama produk</label>
        <input type="text" id="inputTitle" value="Ember Lipat Portable" />
      </div>

      <!-- Deskripsi Singkat -->
      <div class="control-group">
        <label>Deskripsi singkat (hook)</label>
        <textarea id="inputDesc" rows="2">Nggak makan tempat di kamar mandi sempit, habis pakai tinggal lipat rata ke dinding.</textarea>
      </div>

      <!-- Keunggulan -->
      <div class="control-group">
        <label>Keunggulan (pisahkan dengan |)</label>
        <input type="text" id="inputBullets" value="Silikon tebal lentur | Muat 3L–10L | Ada lubang gantung" />
      </div>

      <!-- Tag Relevan -->
      <div class="control-group">
        <label>Tagar relevan produk (tampil di poster & caption)</label>
        <input type="text" id="inputTags" value="#barangrumah #perlengkapankos #emberlipat #shopeehaul" />
      </div>

      <!-- Harga & Ajakan Beli -->
      <div class="control-row">
        <div class="control-group">
          <label>Harga (tulis "Mulai Rp..." jika bervarian)</label>
          <input type="text" id="inputPrice" value="Mulai Rp15.000" />
        </div>
        <div class="control-group">
          <label>Ajakan beli</label>
          <input type="text" id="inputCta" value="Cek di Shopee →" />
        </div>
      </div>

      <!-- Nama Akun -->
      <div class="control-group">
        <label>Nama akun</label>
        <input type="text" id="inputBrand" value="CEKDULU.CHECKOUT" />
      </div>
    </div>
  </div>

  <script>
    // State
    let currentSize = "ig";
    let currentWidth = 1080;
    let currentHeight = 1350;
    let uploadedImages = [];
    let screenshotImages = [];
    let isTextLocked = false;
    let hasGeneratedForCurrentProduct = false;

    // DOM Elements
    const posterCard = document.getElementById("posterCard");
    const previewStage = document.getElementById("previewStage");
