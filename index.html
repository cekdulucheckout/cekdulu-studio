<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Template Affiliate Studio • cekdulu.checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-dark: #141c17;
      --panel-dark: #1d2620;
      --input-dark: #141b16;
      --border-dark: #2f3d34;
      --text-light: #f3f4f1;
      --text-muted: #9ba69e;
      --accent-green: #26382b;
      --card-cream: #f7f4ec;
      --card-box: #ebe5d5;
      --card-text: #1c2920;
      --card-sub: #5c665f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-light);
    }
    .header p {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* Platform Size Selector */
    .size-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .size-btn {
      background: var(--panel-dark);
      border: 1.5px solid var(--border-dark);
      color: var(--text-muted);
      padding: 10px 8px;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .size-btn strong {
      display: block;
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 2px;
    }
    .size-btn span {
      font-size: 10.5px;
    }
    .size-btn.active {
      border-color: #68b07b;
      background: #223227;
    }
    .size-btn.active strong {
      color: #8ee0a3;
    }

    /* Preview Wrapper */
    .preview-stage {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
      padding: 4px 0;
    }

    /* Actual Poster Card Base */
    #posterCard {
      background-color: var(--card-cream);
      color: var(--card-text);
      border-radius: 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      transform-origin: top center;
      flex-shrink: 0;
    }

    /* 1. IG & FB: 1080 x 1350 */
    #posterCard.size-ig {
      width: 1080px;
      height: 1350px;
      padding: 64px 68px;
    }
    #posterCard.size-ig .image-box {
      height: 640px;
      margin: 32px 0 38px 0;
    }

    /* 2. TikTok: 1080 x 1920 */
    #posterCard.size-tiktok {
      width: 1080px;
      height: 1920px;
      padding: 110px 72px 130px 72px;
    }
    #posterCard.size-tiktok .image-box {
      height: 880px;
      margin: 44px 0 52px 0;
    }
    #posterCard.size-tiktok .card-title {
      font-size: 72px;
      margin-bottom: 24px;
    }
    #posterCard.size-tiktok .card-desc {
      font-size: 34px;
      margin-bottom: 32px;
    }
    #posterCard.size-tiktok .card-bullets {
      font-size: 30px;
    }

    /* 3. X & Threads: 1600 x 900 */
    #posterCard.size-x {
      width: 1600px;
      height: 900px;
      padding: 56px 68px;
      flex-direction: row;
      gap: 56px;
      align-items: stretch;
    }
    #posterCard.size-x .x-left {
      width: 680px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    #posterCard.size-x .x-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    #posterCard.size-x .image-box {
      flex: 1;
      height: 100%;
      margin: 0;
    }
    #posterCard.size-x .card-title {
      font-size: 62px;
    }

    /* Card Internal Elements */
    .card-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: var(--card-sub);
      text-transform: uppercase;
    }

    /* Multi-Photo Collage Container */
    .image-box {
      width: 100%;
      background-color: var(--card-box);
      border-radius: 32px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .image-placeholder {
      color: #8f8a7c;
      font-size: 28px;
      font-weight: 500;
      text-align: center;
      padding: 20px;
    }

    .photo-grid {
      width: 100%;
      height: 100%;
      display: grid;
      gap: 12px;
      background-color: var(--card-cream);
    }
    .photo-grid.count-1 {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      gap: 0;
    }
    .photo-grid.count-2 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
    }
    .photo-grid.count-3 {
      grid-template-columns: 1.35fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .photo-grid.count-3 .photo-slot:first-child {
      grid-row: 1 / 3;
    }
    .photo-grid.count-4 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    .photo-slot {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      background-color: var(--card-box);
      border-radius: 22px;
    }
    .photo-grid.count-1 .photo-slot {
      border-radius: 32px;
    }
    .photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.1s ease, filter 0.1s ease;
    }
    .more-overlay {
      position: absolute;
      inset: 0;
      background: rgba(20, 28, 23, 0.58);
      color: #fff;
      font-size: 46px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-body {
      display: flex;
      flex-direction: column;
    }

    .card-category {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--card-sub);
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .card-category .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #79947e;
      display: inline-block;
    }

    .card-title {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.12;
      color: var(--card-text);
      margin-bottom: 18px;
      letter-spacing: -1px;
    }

    .card-desc {
      font-size: 30px;
      line-height: 1.42;
      color: var(--card-sub);
      margin-bottom: 24px;
      font-weight: 400;
    }

    .card-bullets {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 26px;
      font-size: 27px;
      font-weight: 600;
      color: #36453b;
    }
    .card-bullets span {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .card-bullets span::before {
      content: "•";
      color: #79947e;
      font-size: 32px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: auto;
      padding-top: 28px;
    }

    .price-block .price-label {
      font-size: 24px;
      color: var(--card-sub);
      margin-bottom: 4px;
      font-weight: 500;
    }
    .price-block .price-value {
      font-size: 54px;
      font-weight: 800;
      color: var(--card-text);
      letter-spacing: -0.5px;
    }

    .cta-pill {
      background-color: var(--accent-green);
      color: #ffffff;
      font-size: 30px;
      font-weight: 700;
      padding: 26px 46px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    /* Action Download Bar */
    .action-bar {
      display: flex;
      gap: 10px;
    }
    .btn-download {
      flex: 1;
      background: #4e9a63;
      color: #fff;
      border: none;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-download:hover {
      background: #3f8252;
    }
    .btn-download:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    /* Control Panel */
    .controls-panel {
      background: var(--panel-dark);
      border: 1px solid var(--border-dark);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      background: var(--input-dark);
      border: 1px solid var(--border-dark);
      color: var(--text-light);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13.5px;
      outline: none;
    }
    input[type="text"]:focus,
    input[type="password"]:focus,
    textarea:focus {
      border-color: #68b07b;
    }

    .file-upload-box {
      background: var(--input-dark);
      border: 1px dashed var(--border-dark);
      padding: 10px 12px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .file-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-file-pick {
      background: #2b3a30;
      color: #e4ede6;
      border: 1px solid #3f5446;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-file-clear {
      background: transparent;
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, 0.35);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    .photo-count-badge {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: auto;
    }

    /* Thumbnail Strip */
    .thumb-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .thumb-strip:empty {
      display: none;
    }
    .thumb-item {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      border: 1px solid var(--border-dark);
    }
    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: none;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    /* AI Copywriter Box */
    .ai-box {
      background: #17241c;
      border: 1px solid #2e4a38;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ai-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ai-header span {
      font-size: 12.5px;
      font-weight: 700;
      color: #8ee0a3;
    }
    .ss-upload-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 22, 18, 0.7);
      border: 1px dashed #395c45;
      padding: 8px 10px;
      border-radius: 9px;
    }
    .btn-ss-pick {
      background: #243b2c;
      color: #b7ebd0;
      border: 1px solid #3c634a;
      padding: 7px 11px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .ss-info-text {
      font-size: 11.5px;
      color: #96b09f;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .btn-ai {
      background: linear-gradient(135deg, #2e7d47, #1f5c33);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-ai:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .ai-status {
      font-size: 11.5px;
      color: #a3c4ad;
      display: none;
      line-height: 1.4;
    }
    .checkbox-inline {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-muted);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="header">
      <h1 id="headerTitle">Template Affiliate • 1080×1350</h1>
      <p>Pilih ukuran platform, unggah foto produk untuk poster, dan/atau unggah screenshot halaman Shopee agar AI meracik judul, deskripsi hook, dan harga otomatis.</p>
    </div>

    <!-- Platform Size Switcher -->
    <div class="size-tabs">
      <button class="size-btn active" data-size="ig" data-w="1080" data-h="1350" data-label="1080×1350">
        <strong>IG & Facebook</strong>
        <span>1080 × 1350</span>
      </button>
      <button class="size-btn" data-size="tiktok" data-w="1080" data-h="1920" data-label="1080×1920">
        <strong>TikTok / Story</strong>
        <span>1080 × 1920</span>
      </button>
      <button class="size-btn" data-size="x" data-w="1600" data-h="900" data-label="1600×900">
        <strong>X & Threads</strong>
        <span>1600 × 900</span>
      </button>
    </div>

    <!-- Live Scaled Poster Preview -->
    <div class="preview-stage" id="previewStage">
      <div id="posterCard" class="size-ig"></div>
    </div>

    <!-- Download Button -->
    <div class="action-bar">
      <button class="btn-download" id="downloadBtn">
        💾 Unduh Gambar PNG (<span id="btnSizeText">1080×1350</span>)
      </button>
    </div>

    <!-- Editor Controls -->
    <div class="controls-panel">
      <!-- Upload Multi-Foto Produk (Untuk Poster) -->
      <div class="control-group">
        <label>1. Foto produk untuk poster (bisa pilih lebih dari 1 foto)</label>
        <div class="file-upload-box">
          <input type="file" id="imageInput" accept="image/*" multiple style="display: none;" />
          <div class="file-actions">
            <button type="button" class="btn-file-pick" id="pickFilesBtn">📷 Pilih / Tambah Foto</button>
            <button type="button" class="btn-file-clear" id="clearFilesBtn">Hapus Semua</button>
            <span class="photo-count-badge" id="photoCountBadge">0 foto dipilih</span>
          </div>
          <div class="thumb-strip" id="thumbStrip"></div>
        </div>
      </div>

      <!-- AI Copywriter & Screenshot Reader Box -->
      <div class="ai-box">
        <div class="ai-header">
          <span>✨ Copywriter Otomatis (Baca Screenshot / Foto)</span>
          <label class="checkbox-inline">
            <input type="checkbox" id="autoGenOnUpload" checked /> Auto-jalan
          </label>
        </div>

        <input type="password" id="geminiApiKey" placeholder="Tempel Gemini API Key kamu di sini (tersimpan di browser)" />

        <!-- Upload Screenshot Shopee (Tidak tampil di poster, hanya dibaca AI) -->
        <div class="ss-upload-row">
          <input type="file" id="screenshotInput" accept="image/*" multiple style="display: none;" />
          <button type="button" class="btn-ss-pick" id="pickSsBtn">📄 Upload Screenshot Shopee</button>
          <span class="ss-info-text" id="ssInfoText">Opsional: SS judul, deskripsi & harga</span>
          <button type="button" class="btn-file-clear" id="clearSsBtn" style="padding: 5px 8px;">×</button>
        </div>

        <button class="btn-ai" id="generateAiBtn" type="button">
          ✍️ Racik Judul, Hook & Keunggulan Natural
        </button>
        <div class="ai-status" id="aiStatus"></div>
      </div>

      <!-- Zoom & Kecerahan -->
      <div class="control-row">
        <div class="control-group">
          <label>Zoom foto</label>
          <input type="range" id="zoomRange" min="1" max="2.5" step="0.05" value="1" />
        </div>
        <div class="control-group">
          <label>Kecerahan</label>
          <input type="range" id="brightnessRange" min="0.6" max="1.5" step="0.05" value="1.05" />
        </div>
      </div>

      <!-- Nomor & Kategori -->
      <div class="control-row">
        <div class="control-group">
          <label>Nomor</label>
          <input type="text" id="inputNumber" value="No. 001" />
        </div>
        <div class="control-group">
          <label>Kategori</label>
          <input type="text" id="inputCategory" value="Perlengkapan Rumah" />
        </div>
      </div>

      <!-- Nama Produk -->
      <div class="control-group">
        <label>Nama produk</label>
        <input type="text" id="inputTitle" value="Ember Lipat Portable" />
      </div>

      <!-- Deskripsi Singkat -->
      <div class="control-group">
        <label>Deskripsi singkat (hook)</label>
        <textarea id="inputDesc" rows="2">Nggak makan tempat di kamar mandi sempit, habis pakai tinggal lipat rata ke dinding.</textarea>
      </div>

      <!-- Keunggulan -->
      <div class="control-group">
        <label>Keunggulan (pisahkan dengan |)</label>
        <input type="text" id="inputBullets" value="Silikon tebal lentur | Muat 3L–10L | Ada lubang gantung" />
      </div>

      <!-- Harga & Ajakan Beli -->
      <div class="control-row">
        <div class="control-group">
          <label>Harga (tulis "Mulai Rp..." jika bervarian)</label>
          <input type="text" id="inputPrice" value="Mulai Rp15.000" />
        </div>
        <div class="control-group">
          <label>Ajakan beli</label>
          <input type="text" id="inputCta" value="Cek di Shopee →" />
        </div>
      </div>

      <!-- Nama Akun -->
      <div class="control-group">
        <label>Nama akun</label>
        <input type="text" id="inputBrand" value="CEKDULU.CHECKOUT" />
      </div>
    </div>
  </div>

  <script>
    // State
    let currentSize = "ig";
    let currentWidth = 1080;
    let currentHeight = 1350;
    let uploadedImages = [];      // Foto produk bersih untuk poster
    let screenshotImages = [];    // Screenshot halaman Shopee (hanya dibaca AI)

    // DOM Elements
    const posterCard = document.getElementById("posterCard");
    const previewStage = document.getElementById("previewStage");
    const headerTitle = document.getElementById("headerTitle");
    const btnSizeText = document.getElementById("btnSizeText");
    const downloadBtn = document.getElementById("downloadBtn");

    const imageInput = document.getElementById("imageInput");
    const pickFilesBtn = document.getElementById("pickFilesBtn");
    const clearFilesBtn = document.getElementById("clearFilesBtn");
    const photoCountBadge = document.getElementById("photoCountBadge");
    const thumbStrip = document.getElementById("thumbStrip");

    const screenshotInput = document.getElementById("screenshotInput");
    const pickSsBtn = document.getElementById("pickSsBtn");
    const clearSsBtn = document.getElementById("clearSsBtn");
    const ssInfoText = document.getElementById("ssInfoText");

    const zoomRange = document.getElementById("zoomRange");
    const brightnessRange = document.getElementById("brightnessRange");

    const inputNumber = document.getElementById("inputNumber");
    const inputCategory = document.getElementById("inputCategory");
    const inputTitle = document.getElementById("inputTitle");
    const inputDesc = document.getElementById("inputDesc");
    const inputBullets = document.getElementById("inputBullets");
    const inputPrice = document.getElementById("inputPrice");
    const inputCta = document.getElementById("inputCta");
    const inputBrand = document.getElementById("inputBrand");

    const geminiApiKeyInput = document.getElementById("geminiApiKey");
    const generateAiBtn = document.getElementById("generateAiBtn");
    const autoGenOnUpload = document.getElementById("autoGenOnUpload");
    const aiStatus = document.getElementById("aiStatus");

    // Load saved API key
    const savedKey = localStorage.getItem("cekdulu_gemini_api_key");
    if (savedKey) geminiApiKeyInput.value = savedKey;

    geminiApiKeyInput.addEventListener("input", () => {
      localStorage.setItem("cekdulu_gemini_api_key", geminiApiKeyInput.value.trim());
    });

    // Build Collage HTML for Poster
    function buildImageCollageHtml() {
      const count = uploadedImages.length;
      if (count === 0) {
        return `<div class="image-placeholder">Unggah 1 atau beberapa foto produk</div>`;
      }

      const zoom = zoomRange.value;
      const brightness = brightnessRange.value;
      const displayCount = Math.min(count, 4);
      const gridClass = `count-${displayCount}`;

      let slotsHtml = "";
      for (let i = 0; i < displayCount; i++) {
        const imgObj = uploadedImages[i];
        const extraBadge = (i === 3 && count > 4)
          ? `<div class="more-overlay">+${count - 4}</div>`
          : "";
        slotsHtml += `
          <div class="photo-slot">
            <img src="${imgObj.dataUrl}" style="transform: scale(${zoom}); filter: brightness(${brightness});" alt="Produk ${i + 1}" />
            ${extraBadge}
          </div>
        `;
      }

      return `<div class="photo-grid ${gridClass}">${slotsHtml}</div>`;
    }

    function renderThumbnails() {
      const count = uploadedImages.length;
      photoCountBadge.textContent = `${count} foto dipilih`;
      clearFilesBtn.style.display = count > 0 ? "inline-block" : "none";

      thumbStrip.innerHTML = uploadedImages
        .map((img, idx) => `
          <div class="thumb-item">
            <img src="${img.dataUrl}" alt="Thumb ${idx + 1}" />
            <button type="button" class="thumb-remove" data-idx="${idx}" title="Hapus foto">×</button>
          </div>
        `)
        .join("");

      thumbStrip.querySelectorAll(".thumb-remove").forEach(btn => {
        btn.addEventListener("click", () => {
          const removeIdx = parseInt(btn.dataset.idx, 10);
          uploadedImages.splice(removeIdx, 1);
          renderThumbnails();
          renderPoster();
        });
      });
    }

    function updateSsUi() {
      const count = screenshotImages.length;
      if (count === 0) {
        ssInfoText.textContent = "Opsional: SS judul, deskripsi & harga";
        ssInfoText.style.color = "#96b09f";
        clearSsBtn.style.display = "none";
      } else {
        ssInfoText.textContent = `${count} screenshot Shopee siap dibaca AI`;
        ssInfoText.style.color = "#8ee0a3";
        clearSsBtn.style.display = "inline-block";
      }
    }

    function renderPoster() {
      const brand = inputBrand.value || "CEKDULU.CHECKOUT";
      const num = inputNumber.value || "No. 001";
      const category = inputCategory.value || "Perlengkapan Rumah";
      const title = inputTitle.value || "Nama Produk";
      const desc = inputDesc.value || "";
      const bulletsRaw = inputBullets.value || "";
      const priceText = inputPrice.value.trim();
      const cta = inputCta.value || "Cek di Shopee →";

      let priceLabel = "";
      let priceMain = priceText;
      if (priceText.toLowerCase().startsWith("mulai ")) {
        priceLabel = "Mulai";
        priceMain = priceText.substring(6).trim();
      }

      const bulletsHtml = bulletsRaw
        .split("|")
        .map(b => b.trim())
        .filter(Boolean)
        .map(b => `<span>${escapeHtml(b)}</span>`)
        .join("");

      const imageHtml = buildImageCollageHtml();

      posterCard.className = `size-${currentSize}`;

      if (currentSize === "x") {
        posterCard.innerHTML = `
          <div class="x-left">
            <div class="image-box">${imageHtml}</div>
          </div>
          <div class="x-right">
            <div class="card-top-bar">
              <span>${escapeHtml(brand)}</span>
              <span>${escapeHtml(num)}</span>
            </div>
            <div class="card-body">
              <div class="card-category"><i class="dot"></i>${escapeHtml(category)}</div>
              <div class="card-title">${escapeHtml(title)}</div>
              <div class="card-desc">${escapeHtml(desc)}</div>
              <div class="card-bullets">${bulletsHtml}</div>
            </div>
            <div class="card-footer">
              <div class="price-block">
                ${priceLabel ? `<div class="price-label">${escapeHtml(priceLabel)}</div>` : ""}
                <div class="price-value">${escapeHtml(priceMain)}</div>
              </div>
              <div class="cta-pill">${escapeHtml(cta)}</div>
            </div>
          </div>
        `;
      } else {
        posterCard.innerHTML = `
          <div class="card-top-bar">
            <span>${escapeHtml(brand)}</span>
            <span>${escapeHtml(num)}</span>
          </div>
          <div class="image-box">${imageHtml}</div>
          <div class="card-body">
            <div class="card-category"><i class="dot"></i>${escapeHtml(category)}</div>
            <div class="card-title">${escapeHtml(title)}</div>
            <div class="card-desc">${escapeHtml(desc)}</div>
            <div class="card-bullets">${bulletsHtml}</div>
          </div>
          <div class="card-footer">
            <div class="price-block">
              ${priceLabel ? `<div class="price-label">${escapeHtml(priceLabel)}</div>` : ""}
              <div class="price-value">${escapeHtml(priceMain)}</div>
            </div>
            <div class="cta-pill">${escapeHtml(cta)}</div>
          </div>
        `;
      }

      scalePreview();
    }

    function scalePreview() {
      const containerWidth = previewStage.clientWidth;
      const scale = Math.min(containerWidth / currentWidth, 1);
      posterCard.style.transform = `scale(${scale})`;
      previewStage.style.height = `${currentHeight * scale}px`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Size Switcher Events
    document.querySelectorAll(".size-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".size-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentSize = btn.dataset.size;
        currentWidth = parseInt(btn.dataset.w, 10);
        currentHeight = parseInt(btn.dataset.h, 10);
        headerTitle.textContent = `Template Affiliate • ${btn.dataset.label}`;
        btnSizeText.textContent = btn.dataset.label;
        renderPoster();
      });
    });

    // Live Form Listeners
    [
      zoomRange, brightnessRange, inputNumber, inputCategory,
      inputTitle, inputDesc, inputBullets, inputPrice, inputCta, inputBrand
    ].forEach(el => el.addEventListener("input", renderPoster));

    window.addEventListener("resize", scalePreview);

    // Helper: Read FileList to Base64 array
    function readFilesAsDataUrls(fileList) {
      return Promise.all(
        Array.from(fileList).map(file => new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = ev => resolve({
            dataUrl: ev.target.result,
            mimeType: file.type || "image/jpeg"
          });
          reader.readAsDataURL(file);
        }))
      );
    }

    // Poster Product Photos Upload
    pickFilesBtn.addEventListener("click", () => imageInput.click());
    clearFilesBtn.addEventListener("click", () => {
      uploadedImages = [];
      imageInput.value = "";
      renderThumbnails();
      renderPoster();
    });

    imageInput.addEventListener("change", async (e) => {
      if (!e.target.files || e.target.files.length === 0) return;
      const newImgs = await readFilesAsDataUrls(e.target.files);
      uploadedImages = uploadedImages.concat(newImgs);
      imageInput.value = "";
      renderThumbnails();
      renderPoster();

      if (autoGenOnUpload.checked && geminiApiKeyInput.value.trim()) {
        await generateWithGemini();
      }
    });

    // Screenshot Shopee Upload (AI Context Only)
    pickSsBtn.addEventListener("click", () => screenshotInput.click());
    clearSsBtn.addEventListener("click", () => {
      screenshotImages = [];
      screenshotInput.value = "";
      updateSsUi();
    });

    screenshotInput.addEventListener("change", async (e) => {
      if (!e.target.files || e.target.files.length === 0) return;
      const newSs = await readFilesAsDataUrls(e.target.files);
      screenshotImages = screenshotImages.concat(newSs);
      screenshotInput.value = "";
      updateSsUi();

      if (autoGenOnUpload.checked && geminiApiKeyInput.value.trim()) {
        await generateWithGemini();
      }
    });

    // Gemini API Human-Style Copywriter & Screenshot Extractor
    async function generateWithGemini() {
      const apiKey = geminiApiKeyInput.value.trim();
      if (!apiKey) {
        showStatus("⚠️ Masukkan Gemini API Key terlebih dahulu.", "#fbbf24");
        return;
      }

      const totalSourceImages = screenshotImages.length + uploadedImages.length;
      if (totalSourceImages === 0) {
        showStatus("⚠️ Unggah foto produk atau screenshot halaman Shopee terlebih dahulu.", "#fbbf24");
        return;
      }

      generateAiBtn.disabled = true;
      const sourceNote = screenshotImages.length > 0
        ? `membaca ${screenshotImages.length} screenshot Shopee`
        : `menganalisis ${uploadedImages.length} foto produk`;
      showStatus(`⏳ Copywriter AI sedang ${sourceNote}...`, "#8ee0a3");

      try {
        const promptText = `Kamu adalah senior copywriter manusia asli untuk akun kurasi barang rumah & kos Indonesia "cekdulu.checkout" (slogan: "Murah itu wajib, bagus itu harus").

TUGAS UTAMA:
Baca seluruh gambar yang dilampirkan (baik screenshot halaman produk Shopee yang berisi judul panjang, deskripsi toko, spesifikasi bahan/ukuran, dan harga, maupun foto produknya). Sarikan menjadi teks kartu katalog yang ringkas, jujur, tajam, dan bikin orang langsung pengen klik.

ATURAN GAYA BAHASA (WAJIB DIPATUHI AGAR TIDAK TERLIHAT SEPERTI AI):
1. DILARANG KERAS memakai kata-kata klise AI seperti: "solusi tepat", "solusi praktis", "hadir untuk", "tingkatkan kualitas", "revolusioner", "nikmati kemudahan", "didesain khusus", "sempurna untuk", "wajib punya".
2. Gunakan bahasa percakapan Indonesia yang natural, to the point, dan membumi (seperti teman yang habis ngecek barang bagus lalu ngasih tau).
3. Hook di deskripsi harus langsung menyentuh masalah nyata atau detail fisik spesifik dari produk (misal: "Dapur sempit sering berantakan? Rak putar ini bikin bumbu gampang diambil tanpa ngacak-ngacak belakangnya." atau "Nggak makan tempat di kamar mandi sempit, habis pakai tinggal lipat rata ke dinding.").
4. Ambil fakta konkret dari screenshot (ukuran cm/liter, bahan stainless/silikon/PP, kapasitas kg, isi paket) untuk dimasukkan ke judul, deskripsi, atau 3 poin keunggulan.
5. Untuk harga: jika di screenshot terlihat harga produk, ekstrak angka terendahnya lalu bulatkan rapi ke ribuan terdekat. Jika ada rentang/variasi harga, tulis "Mulai RpXX.XXX". Jika harga tunggal, tulis "RpXX.XXX". Jika harga tidak terlihat di gambar, isi string kosong "".

Keluarkan HANYA JSON murni tanpa markdown:
{
  "kategori": "Pilih 1 paling pas: Alat Dapur | Wadah & Rak | Alat Kebersihan | Kamar Mandi | Perlengkapan Rumah | Dekorasi Rumah | Gadget & Elektronik | Pakaian & Outfit",
  "nama_produk": "Nama produk bersih tanpa spam keyword Shopee, 2-5 kata, cantumkan ukuran/kapasitas utama bila relevan (contoh: Saringan Minyak Stainless 1,3L)",
  "deskripsi": "1 kalimat hook tajam & natural yang bikin penasaran atau langsung terasa manfaatnya, maksimal 95 karakter",
  "keunggulan": "3 fakta keunggulan konkret dipisahkan tanda | (contoh: Bahan stainless anti karat | Ada tutup & saringan halus | Gagang anti panas)",
  "harga": "Mulai RpXX.XXX atau RpXX.XXX atau kosong jika tidak ada info harga di gambar"
}`;

        // Prioritize screenshots first so AI reads title, specs, and price clearly, then product photos
        const combinedImages = [...screenshotImages, ...uploadedImages].slice(0, 5);
        const imageParts = combinedImages.map(img => ({
          inline_data: {
            mime_type: img.mimeType,
            data: img.dataUrl.split(",")[1]
          }
        }));

        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  ...imageParts
                ]
              }],
              generationConfig: {
                response_mime_type: "application/json",
                temperature: 0.65
              }
            })
          }
        );

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error?.message || `HTTP ${response.status}`);
        }

        const result = await response.json();
        const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
        const parsed = JSON.parse(rawText);

        if (parsed.kategori) inputCategory.value = parsed.kategori;
        if (parsed.nama_produk) inputTitle.value = parsed.nama_produk;
        if (parsed.deskripsi) inputDesc.value = parsed.deskripsi;
        if (parsed.keunggulan) inputBullets.value = parsed.keunggulan;
        if (parsed.harga && parsed.harga.trim() !== "") inputPrice.value = parsed.harga.trim();

        renderPoster();
        showStatus("✅ Judul, hook natural & detail produk berhasil diracik!", "#8ee0a3");
      } catch (err) {
        console.error(err);
        showStatus(`❌ Gagal generate: ${err.message}`, "#f87171");
      } finally {
        generateAiBtn.disabled = false;
      }
    }

    generateAiBtn.addEventListener("click", generateWithGemini);

    function showStatus(msg, color) {
      aiStatus.style.display = "block";
      aiStatus.style.color = color;
      aiStatus.textContent = msg;
    }

    // Download High-Resolution PNG
    downloadBtn.addEventListener("click", async () => {
      downloadBtn.disabled = true;
      const originalHtml = downloadBtn.innerHTML;
      downloadBtn.innerHTML = "⏳ Menyimpan gambar resolusi penuh...";

      try {
        const prevTransform = posterCard.style.transform;
        posterCard.style.transform = "scale(1)";

        const canvas = await html2canvas(posterCard, {
          width: currentWidth,
          height: currentHeight,
          scale: 1,
          useCORS: true,
          backgroundColor: null
        });

        posterCard.style.transform = prevTransform;

        const cleanTitle = (inputTitle.value || "produk")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/(^-|-$)/g, "");
        const fileName = `${inputNumber.value.replace(/[^a-zA-Z0-9]/g, "") || "001"}-${cleanTitle}-${currentWidth}x${currentHeight}.png`;

        const link = document.createElement("a");
        link.download = fileName;
        link.href = canvas.toDataURL("image/png");
        link.click();
      } catch (err) {
        alert("Gagal menyimpan gambar: " + err.message);
      } finally {
        downloadBtn.disabled = false;
        downloadBtn.innerHTML = originalHtml;
      }
    });

    // Initial render
    renderThumbnails();
    updateSsUi();
    renderPoster();
  </script>
</body>
</html>
