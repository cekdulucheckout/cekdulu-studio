<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Template Affiliate Studio • cekdulu.checkout</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#141c17" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-dark: #141c17;
      --panel-dark: #1d2620;
      --input-dark: #141b16;
      --border-dark: #2f3d34;
      --text-light: #f3f4f1;
      --text-muted: #9ba69e;
      --accent-green: #26382b;
      --card-cream: #f7f4ec;
      --card-box: #ebe5d5;
      --card-text: #1c2920;
      --card-sub: #5c665f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-light);
    }
    .header p {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .size-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .size-btn {
      background: var(--panel-dark);
      border: 1.5px solid var(--border-dark);
      color: var(--text-muted);
      padding: 10px 8px;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .size-btn strong {
      display: block;
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 2px;
    }
    .size-btn span {
      font-size: 10.5px;
    }
    .size-btn.active {
      border-color: #68b07b;
      background: #223227;
    }
    .size-btn.active strong {
      color: #8ee0a3;
    }

    .preview-stage {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
      padding: 4px 0;
    }

    .poster-card {
      background-color: var(--card-cream);
      color: var(--card-text);
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transform-origin: top center;
      flex-shrink: 0;
    }

    .poster-card.size-ig {
      width: 1080px;
      height: 1350px;
      padding: 60px 68px;
    }
    .poster-card.size-ig .image-box {
      height: 600px;
      margin: 28px 0 32px 0;
    }

    .poster-card.size-tiktok {
      width: 1080px;
      height: 1920px;
      padding: 105px 72px 125px 72px;
    }
    .poster-card.size-tiktok .image-box {
      height: 840px;
      margin: 40px 0 46px 0;
    }
    .poster-card.size-tiktok .card-title {
      font-size: 70px;
      margin-bottom: 22px;
    }
    .poster-card.size-tiktok .card-desc {
      font-size: 33px;
      margin-bottom: 26px;
    }
    .poster-card.size-tiktok .card-bullets {
      font-size: 29px;
    }

    .poster-card.size-x {
      width: 1600px;
      height: 900px;
      padding: 52px 64px;
      flex-direction: row;
      gap: 52px;
      align-items: stretch;
    }
    .poster-card.size-x .x-left {
      width: 670px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .poster-card.size-x .x-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .poster-card.size-x .image-box {
      flex: 1;
      height: 100%;
      margin: 0;
    }
    .poster-card.size-x .card-title {
      font-size: 58px;
    }
    .poster-card.size-x .card-desc {
      font-size: 28px;
      margin-bottom: 18px;
    }
    .poster-card.size-x .card-bullets {
      font-size: 25px;
    }

    .card-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: var(--card-sub);
      text-transform: uppercase;
    }

    .image-box {
      width: 100%;
      background-color: var(--card-box);
      border-radius: 32px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .image-placeholder {
      color: #8f8a7c;
      font-size: 28px;
      font-weight: 500;
      text-align: center;
      padding: 20px;
    }

    .photo-grid {
      width: 100%;
      height: 100%;
      display: grid;
      gap: 12px;
      background-color: var(--card-cream);
    }
    .photo-grid.count-1 {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      gap: 0;
    }
    .photo-grid.count-2 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
    }
    .photo-grid.count-3 {
      grid-template-columns: 1.35fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .photo-grid.count-3 .photo-slot:first-child {
      grid-row: 1 / 3;
    }
    .photo-grid.count-4 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    .photo-slot {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      background-color: var(--card-box);
      border-radius: 22px;
    }
    .photo-grid.count-1 .photo-slot {
      border-radius: 32px;
    }
    .photo-slot .photo-bg {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }
    .more-overlay {
      position: absolute;
      inset: 0;
      background: rgba(20, 28, 23, 0.58);
      color: #fff;
      font-size: 46px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-body {
      display: flex;
      flex-direction: column;
    }

    .card-category {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--card-sub);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .card-category .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #79947e;
      display: inline-block;
    }

    .card-title {
      font-size: 62px;
      font-weight: 800;
      line-height: 1.12;
      color: var(--card-text);
      margin-bottom: 16px;
      letter-spacing: -1px;
    }

    .card-desc {
      font-size: 29px;
      line-height: 1.4;
      color: var(--card-sub);
      margin-bottom: 20px;
      font-weight: 400;
    }

    .card-bullets {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      font-size: 26px;
      font-weight: 600;
      color: #36453b;
      margin-bottom: 18px;
    }
    .card-bullets span {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .card-bullets span::before {
      content: "•";
      color: #79947e;
      font-size: 30px;
    }

    .card-tags {
      font-size: 22px;
      font-weight: 600;
      color: #5b7862;
      letter-spacing: 0.2px;
      line-height: 1.35;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: auto;
      padding-top: 22px;
    }

    .price-block .price-label {
      font-size: 24px;
      color: var(--card-sub);
      margin-bottom: 4px;
      font-weight: 500;
    }
    .price-block .price-value {
      font-size: 54px;
      font-weight: 800;
      color: var(--card-text);
      letter-spacing: -0.5px;
    }

    .cta-pill {
      background-color: var(--accent-green);
      color: #ffffff;
      font-size: 30px;
      font-weight: 700;
      padding: 24px 44px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .action-bar {
      display: flex;
      gap: 8px;
    }
    .btn-download {
      flex: 2;
      background: #4e9a63;
      color: #fff;
      border: none;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-download:hover {
      background: #3f8252;
    }
    .btn-download:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .btn-copy-caption {
      flex: 1;
      background: #233328;
      color: #a9e3b8;
      border: 1px solid #3c5c46;
      padding: 14px 12px;
      border-radius: 14px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .controls-panel {
      background: var(--panel-dark);
      border: 1px solid var(--border-dark);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      background: var(--input-dark);
      border: 1px solid var(--border-dark);
      color: var(--text-light);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13.5px;
      outline: none;
    }
    input[type="text"]:focus,
    input[type="password"]:focus,
    textarea:focus {
      border-color: #68b07b;
    }

    .file-upload-box {
      background: var(--input-dark);
      border: 1px dashed var(--border-dark);
      padding: 10px 12px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .file-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-file-pick {
      background: #2b3a30;
      color: #e4ede6;
      border: 1px solid #3f5446;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-file-clear {
      background: transparent;
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, 0.35);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    .photo-count-badge {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: auto;
    }

    .thumb-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .thumb-strip:empty {
      display: none;
    }
    .thumb-item {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      border: 1px solid var(--border-dark);
    }
    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: none;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    .ai-box {
      background: #17241c;
      border: 1px solid #2e4a38;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ai-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .ai-header span {
      font-size: 12.5px;
      font-weight: 700;
      color: #8ee0a3;
    }
    .ss-upload-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 22, 18, 0.7);
      border: 1px dashed #395c45;
      padding: 8px 10px;
      border-radius: 9px;
    }
    .btn-ss-pick {
      background: #243b2c;
      color: #b7ebd0;
      border: 1px solid #3c634a;
      padding: 7px 11px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .ss-info-text {
      font-size: 11.5px;
      color: #96b09f;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .ai-btn-row {
      display: flex;
      gap: 8px;
    }
    .btn-ai {
      flex: 1;
      background: linear-gradient(135deg, #2e7d47, #1f5c33);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-ai:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-lock {
      background: #243329;
      color: #a3c4ad;
      border: 1px solid #385241;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-lock.locked {
      background: #473818;
      color: #fcd34d;
      border-color: #926c1d;
    }
    .ai-status {
      font-size: 11.5px;
      color: #a3c4ad;
      display: none;
      line-height: 1.4;
    }
    .checkbox-inline {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-muted);
      cursor: pointer;
    }

    /* Hidden Off-Screen Clean Export Stage */
    #exportSandbox {
      position: fixed;
      left: -9999px;
      top: 0;
      z-index: -1;
      pointer-events: none;
    }
    #exportSandbox .poster-card {
      transform: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <h1 id="headerTitle">Template Affiliate • 1080×1350</h1>
      <p>Unggah foto produk & screenshot Shopee sekali, kunci teksnya agar 100% konsisten, lalu unduh untuk semua ukuran platform.</p>
    </div>

    <div class="size-tabs">
      <button type="button" class="size-btn active" data-size="ig" data-w="1080" data-h="1350" data-label="1080×1350">
        <strong>IG & Facebook</strong>
        <span>1080 × 1350</span>
      </button>
      <button type="button" class="size-btn" data-size="tiktok" data-w="1080" data-h="1920" data-label="1080×1920">
        <strong>TikTok / Story</strong>
        <span>1080 × 1920</span>
      </button>
      <button type="button" class="size-btn" data-size="x" data-w="1600" data-h="900" data-label="1600×900">
        <strong>X & Threads</strong>
        <span>1600 × 900</span>
      </button>
    </div>

    <div class="preview-stage" id="previewStage">
      <div id="posterCard" class="poster-card size-ig"></div>
    </div>

    <div class="action-bar">
      <button type="button" class="btn-download" id="downloadBtn">
        💾 Unduh PNG (<span id="btnSizeText">1080×1350</span>)
      </button>
      <button type="button" class="btn-copy-caption" id="copyCaptionBtn">
        📋 Salin Caption
      </button>
    </div>

    <div class="controls-panel">
      <div class="control-group">
        <label>1. Foto produk untuk poster (bisa pilih lebih dari 1 foto)</label>
        <div class="file-upload-box">
          <input type="file" id="imageInput" accept="image/*" multiple style="display: none;" />
          <div class="file-actions">
            <button type="button" class="btn-file-pick" id="pickFilesBtn">📷 Pilih / Tambah Foto</button>
            <button type="button" class="btn-file-clear" id="clearFilesBtn">Hapus Semua</button>
            <span class="photo-count-badge" id="photoCountBadge">0 foto dipilih</span>
          </div>
          <div class="thumb-strip" id="thumbStrip"></div>
        </div>
      </div>

      <div class="ai-box">
        <div class="ai-header">
          <span>✨ Copywriter Otomatis (Konsisten)</span>
          <label class="checkbox-inline">
            <input type="checkbox" id="autoGenOnUpload" checked /> Auto-jalan sekali
          </label>
        </div>

        <input type="password" id="geminiApiKey" placeholder="Tempel Gemini API Key kamu di sini (tersimpan di browser)" />

        <div class="ss-upload-row">
          <input type="file" id="screenshotInput" accept="image/*" multiple style="display: none;" />
          <button type="button" class="btn-ss-pick" id="pickSsBtn">📄 Upload Screenshot Shopee</button>
          <span class="ss-info-text" id="ssInfoText">Wajib disarankan agar judul 100% akurat</span>
          <button type="button" class="btn-file-clear" id="clearSsBtn" style="padding: 5px 8px;">×</button>
        </div>

        <div class="ai-btn-row">
          <button class="btn-ai" id="generateAiBtn" type="button">
            ✍️ Generate Teks
          </button>
          <button class="btn-lock" id="lockTextBtn" type="button">
            🔓 Kunci Teks
          </button>
        </div>
        <div class="ai-status" id="aiStatus"></div>
      </div>

      <div class="control-row">
        <div class="control-group">
          <label>Zoom foto</label>
          <input type="range" id="zoomRange" min="1" max="2.5" step="0.05" value="1" />
        </div>
        <div class="control-group">
          <label>Kecerahan</label>
          <input type="range" id="brightnessRange" min="0.6" max="1.5" step="0.05" value="1.05" />
        </div>
      </div>

      <div class="control-row">
        <div class="control-group">
          <label>Nomor</label>
          <input type="text" id="inputNumber" value="No. 001" />
        </div>
        <div class="control-group">
          <label>Kategori</label>
          <input type="text" id="inputCategory" value="Perlengkapan Rumah" />
        </div>
      </div>

      <div class="control-group">
        <label>Nama produk</label>
        <input type="text" id="inputTitle" value="Ember Lipat Portable" />
      </div>

      <div class="control-group">
        <label>Deskripsi singkat (hook)</label>
        <textarea id="inputDesc" rows="2">Nggak makan tempat di kamar mandi sempit, habis pakai tinggal lipat rata ke dinding.</textarea>
      </div>

      <div class="control-group">
        <label>Keunggulan (pisahkan dengan |)</label>
        <input type="text" id="inputBullets" value="Silikon tebal lentur | Muat 3L–10L | Ada lubang gantung" />
      </div>

      <div class="control-group">
        <label>Tagar relevan produk (tampil di poster & caption)</label>
        <input type="text" id="inputTags" value="#barangrumah #perlengkapankos #emberlipat #shopeehaul" />
      </div>

      <div class="control-row">
        <div class="control-group">
          <label>Harga (tulis "Mulai Rp..." jika bervarian)</label>
          <input type="text" id="inputPrice" value="Mulai Rp15.000" />
        </div>
        <div class="control-group">
          <label>Ajakan beli</label>
          <input type="text" id="inputCta" value="Cek di Shopee →" />
        </div>
      </div>

      <div class="control-group">
        <label>Nama akun</label>
        <input type="text" id="inputBrand" value="CEKDULU.CHECKOUT" />
      </div>
    </div>
  </div>

  <!-- Off-screen sandbox for 100% clean PNG export -->
  <div id="exportSandbox"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let currentSize = "ig";
      let currentWidth = 1080;
      let currentHeight = 1350;
      let uploadedImages = [];
      let screenshotImages = [];
      let isTextLocked = false;
      let hasGeneratedForCurrentProduct = false;

      const posterCard = document.getElementById("posterCard");
      const previewStage = document.getElementById("previewStage");
      const exportSandbox = document.getElementById("exportSandbox");
      const headerTitle = document.getElementById("headerTitle");
      const btnSizeText = document.getElementById("btnSizeText");
      const downloadBtn = document.getElementById("downloadBtn");
      const copyCaptionBtn = document.getElementById("copyCaptionBtn");

      const imageInput = document.getElementById("imageInput");
      const pickFilesBtn = document.getElementById("pickFilesBtn");
      const clearFilesBtn = document.getElementById("clearFilesBtn");
      const photoCountBadge = document.getElementById("photoCountBadge");
      const thumbStrip = document.getElementById("thumbStrip");

      const screenshotInput = document.getElementById("screenshotInput");
      const pickSsBtn = document.getElementById("pickSsBtn");
      const clearSsBtn = document.getElementById("clearSsBtn");
      const ssInfoText = document.getElementById("ssInfoText");

      const zoomRange = document.getElementById("zoomRange");
      const brightnessRange = document.getElementById("brightnessRange");

      const inputNumber = document.getElementById("inputNumber");
      const inputCategory = document.getElementById("inputCategory");
      const inputTitle = document.getElementById("inputTitle");
      const inputDesc = document.getElementById("inputDesc");
      const inputBullets = document.getElementById("inputBullets");
      const inputTags = document.getElementById("inputTags");
      const inputPrice = document.getElementById("inputPrice");
      const inputCta = document.getElementById("inputCta");
      const inputBrand = document.getElementById("inputBrand");

      const geminiApiKeyInput = document.getElementById("geminiApiKey");
      const generateAiBtn = document.getElementById("generateAiBtn");
      const lockTextBtn = document.getElementById("lockTextBtn");
      const autoGenOnUpload = document.getElementById("autoGenOnUpload");
      const aiStatus = document.getElementById("aiStatus");

      const savedKey = localStorage.getItem("cekdulu_gemini_api_key");
      if (savedKey) geminiApiKeyInput.value = savedKey;

      geminiApiKeyInput.addEventListener("input", () => {
        localStorage.setItem("cekdulu_gemini_api_key", geminiApiKeyInput.value.trim());
      });

      function setTextLock(locked) {
        isTextLocked = locked;
        if (isTextLocked) {
          lockTextBtn.classList.add("locked");
          lockTextBtn.textContent = "🔒 Teks Terkunci";
        } else {
          lockTextBtn.classList.remove("locked");
          lockTextBtn.textContent = "🔓 Kunci Teks";
        }
      }

      lockTextBtn.addEventListener("click", () => {
        setTextLock(!isTextLocked);
        showStatus(
          isTextLocked
            ? "🔒 Teks dikunci! Pindah ukuran IG / TikTok / X tidak akan mengubah teks."
            : "🔓 Kunci dibuka. Kamu bisa generate ulang teks baru.",
          isTextLocked ? "#fcd34d" : "#8ee0a3"
        );
      });

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function buildImageCollageHtml() {
        const count = uploadedImages.length;
        if (count === 0) {
          return `<div class="image-placeholder">Unggah 1 atau beberapa foto produk</div>`;
        }

        const zoom = zoomRange.value;
        const brightness = brightnessRange.value;
        const displayCount = Math.min(count, 4);
        const gridClass = `count-${displayCount}`;

        let slotsHtml = "";
        for (let i = 0; i < displayCount; i++) {
          const imgObj = uploadedImages[i];
          const extraBadge = (i === 3 && count > 4)
            ? `<div class="more-overlay">+${count - 4}</div>`
            : "";
          slotsHtml += `
            <div class="photo-slot">
              <div class="photo-bg" style="background-image: url('${imgObj.dataUrl}'); transform: scale(${zoom}); filter: brightness(${brightness});"></div>
              ${extraBadge}
            </div>
          `;
        }

        return `<div class="photo-grid ${gridClass}">${slotsHtml}</div>`;
      }

      function renderThumbnails() {
        const count = uploadedImages.length;
        photoCountBadge.textContent = `${count} foto dipilih`;
        clearFilesBtn.style.display = count > 0 ? "inline-block" : "none";

        thumbStrip.innerHTML = uploadedImages
          .map((img, idx) => `
            <div class="thumb-item">
              <img src="${img.dataUrl}" alt="Thumb ${idx + 1}" />
              <button type="button" class="thumb-remove" data-idx="${idx}" title="Hapus foto">×</button>
            </div>
          `)
          .join("");

        thumbStrip.querySelectorAll(".thumb-remove").forEach(btn => {
          btn.addEventListener("click", () => {
            const removeIdx = parseInt(btn.dataset.idx, 10);
            uploadedImages.splice(removeIdx, 1);
            renderThumbnails();
            renderPoster();
          });
        });
      }

      function updateSsUi() {
        const count = screenshotImages.length;
        if (count === 0) {
          ssInfoText.textContent = "Wajib disarankan agar judul 100% akurat";
          ssInfoText.style.color = "#96b09f";
          clearSsBtn.style.display = "none";
        } else {
          ssInfoText.textContent = `${count} screenshot Shopee siap dibaca AI`;
          ssInfoText.style.color = "#8ee0a3";
          clearSsBtn.style.display = "inline-block";
        }
      }

      function buildCardInnerHtml() {
        const brand = inputBrand.value || "CEKDULU.CHECKOUT";
        const num = inputNumber.value || "No. 001";
        const category = inputCategory.value || "Perlengkapan Rumah";
        const title = inputTitle.value || "Nama Produk";
        const desc = inputDesc.value || "";
        const bulletsRaw = inputBullets.value || "";
        const tagsRaw = inputTags.value.trim();
        const priceText = inputPrice.value.trim();
        const cta = inputCta.value || "Cek di Shopee →";

        let priceLabel = "";
        let priceMain = priceText;
        if (priceText.toLowerCase().startsWith("mulai ")) {
          priceLabel = "Mulai";
          priceMain = priceText.substring(6).trim();
        }

        const bulletsHtml = bulletsRaw
          .split("|")
          .map(b => b.trim())
          .filter(Boolean)
          .map(b => `<span>${escapeHtml(b)}</span>`)
          .join("");

        const tagsHtml = tagsRaw
          ? `<div class="card-tags">${escapeHtml(tagsRaw)}</div>`
          : "";

        const imageHtml = buildImageCollageHtml();

        if (currentSize === "x") {
          return `
            <div class="x-left">
              <div class="image-box">${imageHtml}</div>
            </div>
            <div class="x-right">
              <div class="card-top-bar">
                <span>${escapeHtml(brand)}</span>
                <span>${escapeHtml(num)}</span>
              </div>
              <div class="card-body">
                <div class="card-category"><i class="dot"></i>${escapeHtml(category)}</div>
                <div class="card-title">${escapeHtml(title)}</div>
                <div class="card-desc">${escapeHtml(desc)}</div>
                <div class="card-bullets">${bulletsHtml}</div>
                ${tagsHtml}
              </div>
              <div class="card-footer">
                <div class="price-block">
                  ${priceLabel ? `<div class="price-label">${escapeHtml(priceLabel)}</div>` : ""}
                  <div class="price-value">${escapeHtml(priceMain)}</div>
                </div>
                <div class="cta-pill">${escapeHtml(cta)}</div>
              </div>
            </div>
          `;
        }

        return `
          <div class="card-top-bar">
            <span>${escapeHtml(brand)}</span>
            <span>${escapeHtml(num)}</span>
          </div>
          <div class="image-box">${imageHtml}</div>
          <div class="card-body">
            <div class="card-category"><i class="dot"></i>${escapeHtml(category)}</div>
            <div class="card-title">${escapeHtml(title)}</div>
            <div class="card-desc">${escapeHtml(desc)}</div>
            <div class="card-bullets">${bulletsHtml}</div>
            ${tagsHtml}
          </div>
          <div class="card-footer">
            <div class="price-block">
              ${priceLabel ? `<div class="price-label">${escapeHtml(priceLabel)}</div>` : ""}
              <div class="price-value">${escapeHtml(priceMain)}</div>
            </div>
            <div class="cta-pill">${escapeHtml(cta)}</div>
          </div>
        `;
      }

      function renderPoster() {
        posterCard.className = `poster-card size-${currentSize}`;
        posterCard.innerHTML = buildCardInnerHtml();
        scalePreview();
      }

      function scalePreview() {
        const containerWidth = previewStage.clientWidth || 500;
        const scale = Math.min(containerWidth / currentWidth, 1);
        posterCard.style.transform = `scale(${scale})`;
        previewStage.style.height = `${currentHeight * scale}px`;
      }

      document.querySelectorAll(".size-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".size-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentSize = btn.dataset.size;
          currentWidth = parseInt(btn.dataset.w, 10);
          currentHeight = parseInt(btn.dataset.h, 10);
          headerTitle.textContent = `Template Affiliate • ${btn.dataset.label}`;
          btnSizeText.textContent = btn.dataset.label;
          renderPoster();
        });
      });

      [
        zoomRange, brightnessRange, inputNumber, inputCategory,
        inputTitle, inputDesc, inputBullets, inputTags, inputPrice, inputCta, inputBrand
      ].forEach(el => el.addEventListener("input", renderPoster));

      window.addEventListener("resize", scalePreview);

      function readFilesAsDataUrls(fileList) {
        return Promise.all(
          Array.from(fileList).map(file => new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = ev => resolve({
              dataUrl: ev.target.result,
              mimeType: file.type || "image/jpeg"
            });
            reader.readAsDataURL(file);
          }))
        );
      }

      pickFilesBtn.addEventListener("click", () => imageInput.click());
      clearFilesBtn.addEventListener("click", () => {
        uploadedImages = [];
        imageInput.value = "";
        hasGeneratedForCurrentProduct = false;
        setTextLock(false);
        renderThumbnails();
        renderPoster();
      });

      imageInput.addEventListener("change", async (e) => {
        if (!e.target.files || e.target.files.length === 0) return;
        const newImgs = await readFilesAsDataUrls(e.target.files);
        uploadedImages = uploadedImages.concat(newImgs);
        imageInput.value = "";
        renderThumbnails();
        renderPoster();

        if (autoGenOnUpload.checked && geminiApiKeyInput.value.trim() && !isTextLocked && !hasGeneratedForCurrentProduct) {
          await generateWithGemini(false);
        }
      });

      pickSsBtn.addEventListener("click", () => screenshotInput.click());
      clearSsBtn.addEventListener("click", () => {
        screenshotImages = [];
        screenshotInput.value = "";
        updateSsUi();
      });

      screenshotInput.addEventListener("change", async (e) => {
        if (!e.target.files || e.target.files.length === 0) return;
        const newSs = await readFilesAsDataUrls(e.target.files);
        screenshotImages = screenshotImages.concat(newSs);
        screenshotInput.value = "";
        updateSsUi();

        if (autoGenOnUpload.checked && geminiApiKeyInput.value.trim() && !isTextLocked) {
          await generateWithGemini(false);
        }
      });

      async function generateWithGemini(isManualClick = true) {
        if (isTextLocked && !isManualClick) return;
        if (isTextLocked && isManualClick) {
          showStatus("⚠️ Teks sedang dikunci (🔒). Klik tombol kunci dulu jika ingin mengganti teks.", "#fbbf24");
          return;
        }

        const apiKey = geminiApiKeyInput.value.trim();
        if (!apiKey) {
          showStatus("⚠️ Masukkan Gemini API Key terlebih dahulu.", "#fbbf24");
          return;
        }

        const totalSourceImages = screenshotImages.length + uploadedImages.length;
        if (totalSourceImages === 0) {
          showStatus("⚠️ Unggah foto produk atau screenshot halaman Shopee terlebih dahulu.", "#fbbf24");
          return;
        }

        generateAiBtn.disabled = true;

        try {
          const promptText = `Kamu adalah copywriter katalog affiliate Indonesia "cekdulu.checkout" (slogan: "Murah itu wajib, bagus itu harus").

TUGAS UTAMA:
Baca semua gambar yang dilampirkan. Jika ada screenshot halaman produk Shopee, WAJIB ikuti judul asli produk pada screenshot tersebut (jangan menebak-nebak fungsi yang berbeda dari judul Shopee-nya). Sarikan menjadi teks kartu katalog yang konsisten, jujur, tajam, dan natural.

ATURAN WAJIB:
1. KONSISTENSI NAMA PRODUK: Gunakan nama asli produk sesuai screenshot Shopee (bersihkan dari kata spam SEO seperti "COD / Bisa Bayar di Tempat / Termurah"). Jika tidak ada screenshot, sebutkan nama barang secara literal dan paling umum (contoh: "Nampan Buah Kaca 27 cm").
2. ANTI-AI: Dilarang keras memakai kata klise AI ("solusi tepat", "solusi praktis", "hadir untuk", "tingkatkan kualitas", "revolusioner", "nikmati kemudahan", "didesain khusus", "sempurna untuk", "wajib punya"). Pakai bahasa sehari-hari yang membumi.
3. HOOK DESKRIPSI: 1 kalimat singkat menyentuh manfaat nyata atau tampilan produk (maksimal 90 karakter).
4. KEUNGGULAN: 3 fakta konkret (ukuran cm/liter, bahan, fitur fisik) dipisahkan tanda |.
5. TAGAR RELEVAN: Buat 4-5 hashtag Bahasa Indonesia yang sangat relevan dengan produk dan kategorinya, huruf kecil semua, dipisah spasi.
6. HARGA: Ekstrak harga terendah dari screenshot lalu bulatkan rapi ke ribuan terdekat. Jika ada variasi harga tulis "Mulai RpXX.XXX", jika tunggal tulis "RpXX.XXX", jika tidak ada info harga isi "".

Keluarkan HANYA JSON murni tanpa markdown:
{
  "kategori": "Pilih 1 paling pas: Alat Dapur | Wadah & Rak | Alat Kebersihan | Kamar Mandi | Perlengkapan Rumah | Dekorasi Rumah | Gadget & Elektronik | Pakaian & Outfit",
  "nama_produk": "Nama produk akurat & konsisten (2-5 kata + ukuran bila ada)",
  "deskripsi": "1 kalimat hook natural maksimal 90 karakter",
  "keunggulan": "Keunggulan 1 | Keunggulan 2 | Keunggulan 3",
  "tagar": "#tag1 #tag2 #tag3 #tag4",
  "harga": "Mulai RpXX.XXX atau RpXX.XXX atau kosong"
}`;

          const combinedImages = [...screenshotImages, ...uploadedImages].slice(0, 5);
          const imageParts = combinedImages.map(img => ({
            inline_data: {
              mime_type: img.mimeType,
              data: img.dataUrl.split(",")[1]
            }
          }));

          const modelsToTry = [
            "gemini-3.8-flash",
            "gemini-3.5-flash-lite"
          ];

          let response = null;
          let lastErrorMsg = "";

          for (const modelName of modelsToTry) {
            showStatus(`⏳ Menganalisis dengan ${modelName}...`, "#8ee0a3");
            response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(apiKey)}`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [{
                    parts: [
                      { text: promptText },
                      ...imageParts
                    ]
                  }],
                  generationConfig: {
                    response_mime_type: "application/json",
                    temperature: 0.1
                  }
                })
              }
            );

            if (response.ok) break;

            const errData = await response.json().catch(() => ({}));
            lastErrorMsg = errData.error?.message || `HTTP ${response.status}`;
          }

          if (!response || !response.ok) {
            throw new Error(lastErrorMsg || "Server AI sedang sibuk, coba beberapa detik lagi.");
          }

          const result = await response.json();
          const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
          const parsed = JSON.parse(rawText);

          if (parsed.kategori) inputCategory.value = parsed.kategori;
          if (parsed.nama_produk) inputTitle.value = parsed.nama_produk;
          if (parsed.deskripsi) inputDesc.value = parsed.deskripsi;
          if (parsed.keunggulan) inputBullets.value = parsed.keunggulan;
          if (parsed.tagar) inputTags.value = parsed.tagar;
          if (parsed.harga && parsed.harga.trim() !== "") inputPrice.value = parsed.harga.trim();

          hasGeneratedForCurrentProduct = true;
          setTextLock(true);
          renderPoster();
          showStatus("✅ Teks & tagar diracik lalu dikunci otomatis (🔒) agar konsisten di semua ukuran!", "#8ee0a3");
        } catch (err) {
          console.error(err);
          showStatus(`❌ Gagal generate: ${err.message}`, "#f87171");
        } finally {
          generateAiBtn.disabled = false;
        }
      }

      generateAiBtn.addEventListener("click", () => generateWithGemini(true));

      function showStatus(msg, color) {
        aiStatus.style.display = "block";
        aiStatus.style.color = color;
        aiStatus.textContent = msg;
      }

      copyCaptionBtn.addEventListener("click", async () => {
        const bulletsList = inputBullets.value
          .split("|")
          .map(b => b.trim())
          .filter(Boolean)
          .map(b => `• ${b}`)
          .join("\n");

        const captionText = `${inputNumber.value} — ${inputTitle.value}\n\n${inputDesc.value}\n\n${bulletsList}\n\nHarga: ${inputPrice.value}\nLink produk ada di bio / katalog cekdulu.checkout 🛒\n\n${inputTags.value}`;

        try {
          await navigator.clipboard.writeText(captionText);
          const prev = copyCaptionBtn.textContent;
          copyCaptionBtn.textContent = "✅ Tersalin!";
          setTimeout(() => { copyCaptionBtn.textContent = prev; }, 2000);
        } catch (err) {
          alert("Gagal menyalin caption: " + err.message);
        }
      });

      // Clean Off-Screen PNG Export (Zero shadow/gray border artifacts)
      downloadBtn.addEventListener("click", async () => {
        downloadBtn.disabled = true;
        const originalHtml = downloadBtn.innerHTML;
        downloadBtn.innerHTML = "⏳ Menyimpan PNG bersih...";

        try {
          const exportCard = document.createElement("div");
          exportCard.className = `poster-card size-${currentSize}`;
          exportCard.innerHTML = buildCardInnerHtml();

          exportSandbox.innerHTML = "";
          exportSandbox.appendChild(exportCard);

          await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

          const canvas = await html2canvas(exportCard, {
            width: currentWidth,
            height: currentHeight,
            scale: 1,
            useCORS: true,
            backgroundColor: "#f7f4ec",
            logging: false
          });

          exportSandbox.innerHTML = "";

          const cleanTitle = (inputTitle.value || "produk")
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/(^-|-$)/g, "");
          const fileName = `${inputNumber.value.replace(/[^a-zA-Z0-9]/g, "") || "001"}-${cleanTitle}-${currentWidth}x${currentHeight}.png`;

          const link = document.createElement("a");
          link.download = fileName;
          link.href = canvas.toDataURL("image/png");
          link.click();
        } catch (err) {
          alert("Gagal menyimpan gambar: " + err.message);
        } finally {
          downloadBtn.disabled = false;
          downloadBtn.innerHTML = originalHtml;
        }
      });

      renderThumbnails();
      updateSsUi();
      renderPoster();
    });
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
